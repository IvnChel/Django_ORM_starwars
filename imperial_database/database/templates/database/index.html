<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Имперская база данных - Все персонажи</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a2a;
            color: #ffe81f;
            margin: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #ffe81f;
            text-align: center;
            border-bottom: 2px solid #ffe81f;
            padding-bottom: 10px;
        }
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .character-card {
            background-color: #1a1a3a;
            border: 1px solid #ffe81f;
            border-radius: 10px;
            padding: 15px;
            transition: transform 0.3s;
        }
        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 232, 31, 0.3);
        }
        .character-card h3 {
            margin-top: 0;
            color: #ffffff;
        }
        .character-card a {
            color: #ffe81f;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border: 1px solid #ffe81f;
            border-radius: 5px;
        }
        .character-card a:hover {
            background-color: #ffe81f;
            color: #0a0a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 Имперская база данных</h1>
        <h2>Все персонажи вселенной "Звёздные войны"</h2>
        
        <div class="character-grid">
            {% for character in characters %}
            <div class="character-card">
                <h3>{{ character.name }}</h3>
                <p><strong>Вид:</strong> {{ character.species }}</p>
                <p><strong>Родная планета:</strong> {{ character.homeworld }}</p>
                <p><strong>Пол:</strong> {{ character.get_gender_display }}</p>
                <a href="{% url 'character_detail' character.id %}">Просмотреть подробности →</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
